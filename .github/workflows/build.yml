name: Build Yukagram

on:
  workflow_dispatch:
  push:

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          fetch-depth: 1

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup properties
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          echo "$KEYSTORE_PROPERTIES"   | base64 -d > keystore.properties
          echo "$LOCAL_PROPERTIES"      | base64 -d > local.properties
          echo "$KEYSTORE"              | base64 -d > release.p12
          echo "$GOOGLE_SERVICES"       | base64 -d > app/google-services.json
          
          echo                                     >> keystore.properties
          echo "keystore.file=$(pwd)/release.p12"  >> keystore.properties
          
          echo                                     >> local.properties
          echo "sdk.dir=$ANDROID_HOME"             >> local.properties
          echo "keystore.file=keystore.properties" >> local.properties

      - name: Build APK
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m"
            -Dorg.gradle.workers.max=1
            -Dorg.gradle.daemon=false
            -Dkotlin.compiler.execution.strategy=in-process
        run: chmod +x ./gradlew && ./gradlew assembleLatestUniversalRelease

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yukagram-release
          path: app/build/outputs/apk/latestUniversal/release/*.apk
          if-no-files-found: error
